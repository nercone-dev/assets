name: Release

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  ESBUILD_VERSION: "0.28.2"
  FONTTOOLS_VERSION: "4.68.0"
  # GitHub rejects release assets of 2 GiB or more.
  ASSET_SIZE_LIMIT: "2147483648"

jobs:
  # Makes sure the tag and a draft release exist, and resolves the commit that the other jobs build.
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.link.outputs.sha }}
    steps:
      - name: Resolve source
        id: source
        run: |
          case "$TAG" in
            '' | -* | *[!A-Za-z0-9._+-]*)
              echo "::error::Unsupported tag name: '$TAG' (allowed: A-Z a-z 0-9 . _ + -, not starting with -)"
              exit 1
              ;;
          esac

          # Only "not found" means missing; any other error (rate limit, network) stops the run.
          if out=$(gh api "repos/$GH_REPO/git/ref/tags/$TAG" 2>&1); then
            tag=exists
          elif printf '%s' "$out" | grep -q 'HTTP 404'; then
            tag=missing
          else
            echo "::error::Failed to look up tag $TAG: $out"
            exit 1
          fi
          if out=$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish 2>&1); then
            release=exists
            release_target=$out
          elif [ "$out" = "release not found" ]; then
            release=missing
            release_target=
          else
            echo "::error::Failed to look up release $TAG: $out"
            exit 1
          fi

          # Without a tag, the tag is created on this commit (the release's target, or the commit the run started from).
          if [ "$tag" = exists ]; then
            ref="refs/tags/$TAG"
          elif [ -n "$release_target" ]; then
            ref="$release_target"
          else
            ref="$GITHUB_SHA"
          fi
          echo "Tag: $tag, release: $release, source: $ref"
          {
            echo "tag=$tag"
            echo "release=$release"
            echo "ref=$ref"
          } >> "$GITHUB_OUTPUT"

      # The tag is created before the release, so that the draft is linked to it from the start.
      # Without this, a draft has no tag (its URL shows untagged-…) until it is published.
      - name: Create tag if missing
        if: steps.source.outputs.tag == 'missing'
        env:
          REF: ${{ steps.source.outputs.ref }}
        run: |
          sha=$(gh api "repos/$GH_REPO/commits/$REF" --jq .sha)
          gh api "repos/$GH_REPO/git/refs" -f "ref=refs/tags/$TAG" -f "sha=$sha" > /dev/null
          echo "Created tag $TAG at $sha"

      - name: Create draft release if missing
        if: steps.source.outputs.release == 'missing'
        run: |
          gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes ""
          echo "Created draft release $TAG"

      - name: Link draft release to tag
        id: link
        run: |
          # A draft made before its tag existed stays untagged until its tag is set again.
          # The URL of a draft is always .../untagged-<random>, even when it is linked to its tag,
          # so the link is checked by the release's tag name and the tag's commit, not by its URL.
          gh release edit "$TAG" --tag "$TAG" > /dev/null
          release_tag=$(gh release view "$TAG" --json tagName --jq .tagName)
          if [ "$release_tag" != "$TAG" ]; then
            echo "::error::Release $TAG has tag name '$release_tag'"
            exit 1
          fi
          sha=$(gh api "repos/$GH_REPO/commits/refs/tags/$TAG" --jq .sha)
          echo "Release $TAG is linked to tag $TAG at $sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  # Archives of the whole repository, with script.js and style.css built in.
  # script.js and style.css are also attached to the release as separate assets.
  contents:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends p7zip-full xz-utils zip
          # --ignore-scripts: the bin/esbuild shim runs the binary of the platform package installed as an optional dependency,
          # so esbuild's install script (which only verifies and optimizes that setup) is not needed.
          npm install --prefix "$RUNNER_TEMP/esbuild" --no-save --no-audit --no-fund --ignore-scripts "esbuild@$ESBUILD_VERSION"
          echo "ESBUILD=$RUNNER_TEMP/esbuild/node_modules/.bin/esbuild" >> "$GITHUB_ENV"

      # Writes dist/assets-$TAG/ and its archives (see tools/build.sh).
      - name: Build contents
        run: |
          "$ESBUILD" --version
          tools/build.sh "$TAG"

      # upload.sh removes each file after uploading it; removing script.js and style.css from dist/assets-$TAG/ is harmless because the archives are already built.
      - name: Upload contents
        run: .github/scripts/upload.sh dist/assets-"$TAG"/script.js dist/assets-"$TAG"/style.css dist/assets-"$TAG".zip dist/assets-"$TAG".7z dist/assets-"$TAG".tar.gz dist/assets-"$TAG".tar.xz

  # Attached as separate assets: inside the archives they made the zip and tar.gz larger than the asset limit.
  # WOFF 1.0 cannot contain a collection, so only TTC and WOFF2 are made.
  # woff2_compress needs about 9 GB of memory for the current fonts; the whole job took about an hour in a recent run.
  fonts:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      # Only fonts/ and the upload script are needed; images/ and sounds/ are not checked out.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            fonts

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends woff2
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --disable-pip-version-check "fonttools==$FONTTOOLS_VERSION"

      - name: Build and upload font collections
        run: |
          export LC_ALL=C
          out="$RUNNER_TEMP/font"
          mkdir -p "$out"

          fonts=()
          while IFS= read -r f; do fonts+=("$f"); done < <(find fonts -type f -name '*.ttf' | sort)
          [ "${#fonts[@]}" -gt 0 ] || { echo "::error::No fonts found"; exit 1; }
          printf '%s\n' "${fonts[@]}"

          "$RUNNER_TEMP/venv/bin/fonttools" ttLib --no-recalc-timestamp -o "$out/fonts.ttc" "${fonts[@]}"
          woff2_compress "$out/fonts.ttc"
          [ -s "$out/fonts.woff2" ] || { echo "::error::woff2_compress did not write fonts.woff2"; exit 1; }

          .github/scripts/upload.sh "$out/fonts.ttc" "$out/fonts.woff2"

  # Published only after every asset is attached, so a failed run leaves a draft instead of an incomplete release.
  publish:
    needs: [contents, fonts]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Publish draft release
        run: |
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true ]; then
            gh release edit "$TAG" --draft=false
            echo "Published release $TAG"
          else
            echo "Release $TAG is already published"
          fi
