  <text class="cls-2" transform="translate(34.74 148.31)"><tspan class="cls-8"><tspan class="cls-26" x="0" y="0">*</tspan><tspan x="9.01" y="0">現在</tspan><tspan class="cls-26" x="33.01" y="0">は</tspan><tspan x="48.01" y="0">Mone</tspan><tspan class="cls-29" x="80.13" y="0">r</tspan><tspan class="cls-26" x="84.45" y="0">oと</tspan><tspan x="109.65" y="0">Li</tspan><tspan class="cls-28" x="119.34" y="0">t</tspan><tspan x="123.15" y="0">ecoi</tspan><tspan class="cls-26" x="147.1" y="0">n</tspan><tspan x="157.19" y="0">による仮想通貨での寄付のみ受け付けています</tspan><tspan class="cls-35" x="409.19" y="0">。</tspan></tspan><tspan class="cls-34"><tspan class="cls-25" x="0" y="14" xml:space="preserve">   </tspan><tspan class="cls-22" x="10.12" y="13.24">Cu</tspan><tspan class="cls-15" x="23.34" y="13.24">r</tspan><tspan class="cls-17" x="27.26" y="13.24">r</tspan><tspan class="cls-22" x="30.86" y="13.24">ent</tspan><tspan class="cls-13" x="45.87" y="13.24">l</tspan><tspan class="cls-19" x="48.34" y="13.24">y</tspan><tspan class="cls-22" x="53.52" y="13.24">, I on</tspan><tspan class="cls-13" x="76.62" y="13.24">l</tspan><tspan class="cls-22" x="79.09" y="13.24">y accept c</tspan><tspan class="cls-15" x="128.31" y="13.24">r</tspan><tspan class="cls-22" x="132.23" y="13.24">yp</tspan><tspan class="cls-16" x="143.98" y="13.24">t</tspan><tspan class="cls-22" x="147.15" y="13.24">ocu</tspan><tspan class="cls-15" x="164.77" y="13.24">r</tspan><tspan class="cls-17" x="168.69" y="13.24">r</tspan><tspan class="cls-22" x="172.29" y="13.24">en</tspan><tspan class="cls-18" x="184.03" y="13.24">c</tspan><tspan class="cls-22" x="189.55" y="13.24">y donations via Mone</tspan><tspan class="cls-17" x="290.55" y="13.24">r</tspan><tspan class="cls-22" x="294.15" y="13.24">o and Li</tspan><tspan class="cls-16" x="331.49" y="13.24">t</tspan><tspan class="cls-22" x="334.67" y="13.24">ecoin.</tspan></tspan><tspan class="cls-8"><tspan class="cls-26" x="0" y="35">*</tspan><tspan x="9.01" y="35">コーヒーは飲めないのでココアです</tspan><tspan class="cls-35" x="201.01" y="35">。</tspan></tspan><tspan class="cls-11"><tspan class="cls-25" x="0" y="49" xml:space="preserve">   </tspan><tspan class="cls-22" x="10.12" y="48.24">I don&apos;t d</tspan><tspan class="cls-14" x="48.86" y="48.24">r</tspan><tspan class="cls-22" x="52.72" y="48.24">ink co</tspan><tspan class="cls-20" x="81.06" y="48.24">f</tspan><tspan class="cls-21" x="84.37" y="48.24">f</tspan><tspan class="cls-22" x="87.78" y="48.24">ee, so it&apos;s coc</tspan><tspan class="cls-14" x="153.42" y="48.24">o</tspan><tspan class="cls-22" x="159.51" y="48.24">a.</tspan></tspan><tspan class="cls-8"><tspan class="cls-26" x="0" y="70">*</tspan><tspan x="9.01" y="70">仮想通貨で寄付を募るというアイデア、そし</tspan><tspan class="cls-26" x="249.01" y="70">て</tspan><tspan x="264.01" y="70">Mone</tspan><tspan class="cls-29" x="296.13" y="70">r</tspan><tspan class="cls-26" x="300.45" y="70">oと</tspan><tspan x="325.65" y="70">Li</tspan><tspan class="cls-28" x="335.34" y="70">t</tspan><tspan x="339.15" y="70">ecoi</tspan><tspan class="cls-26" x="363.1" y="70">n</tspan><tspan x="373.19" y="70">の選択は soichi &lt;soichi1208@p</tspan><tspan class="cls-29" x="548.6" y="70">r</tspan><tspan x="552.91" y="70">o</tspan><tspan class="cls-28" x="560.11" y="70">t</tspan><tspan x="563.92" y="70">on.me&gt; さんを参考にしています</tspan><tspan class="cls-35" x="742.48" y="70">。</tspan></tspan><tspan class="cls-10"><tspan x="0" y="82.24" xml:space="preserve">   The id</tspan><tspan class="cls-23" x="37.99" y="82.24">e</tspan><tspan x="43.92" y="82.24">a of raising funds th</tspan><tspan class="cls-29" x="138.13" y="82.24">r</tspan><tspan x="141.73" y="82.24">ough c</tspan><tspan class="cls-24" x="174.21" y="82.24">r</tspan><tspan x="178.13" y="82.24">yp</tspan><tspan class="cls-28" x="189.88" y="82.24">t</tspan><tspan x="193.05" y="82.24">ocu</tspan><tspan class="cls-24" x="210.67" y="82.24">r</tspan><tspan class="cls-29" x="214.59" y="82.24">r</tspan><tspan x="218.19" y="82.24">en</tspan><tspan class="cls