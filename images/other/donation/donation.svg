  <text class="cls-15" transform="translate(17.14 25.05)"><tspan x="0" y="0">寄付 </tspan><tspan class="cls-4" x="27.38" y="0">Donation</tspan></text>
  <text class="cls-10" transform="translate(34.74 106.31)"><tspan class="cls-8"><tspan class="cls-29" x="0" y="0">*</tspan><tspan x="9.01" y="0">現在</tspan><tspan class="cls-29" x="33.01" y="0">は</tspan><tspan x="48.01" y="0">Bi</tspan><tspan class="cls-30" x="58.77" y="0">t</tspan><tspan x="62.58" y="0">coin、Li</tspan><tspan class="cls-30" x="108.32" y="0">t</tspan><tspan x="112.12" y="0">ecoin、Ethe</tspan><tspan class="cls-31" x="180.4" y="0">r</tspan><tspan x="184.72" y="0">eum、およ</tspan><tspan class="cls-29" x="245.32" y="0">び</tspan><tspan x="260.32" y="0">Mone</tspan><tspan class="cls-31" x="292.44" y="0">r</tspan><tspan class="cls-29" x="296.76" y="0">o</tspan><tspan x="306.96" y="0">による仮想通貨での寄付のみ受け付けています</tspan><tspan class="cls-38" x="558.96" y="0">。</tspan></tspan><tspan class="cls-37"><tspan class="cls-28" x="0" y="14" xml:space="preserve">   </tspan><tspan class="cls-25" x="10.12" y="13.24">Cu</tspan><tspan class="cls-18" x="23.34" y="13.24">r</tspan><tspan class="cls-20" x="27.26" y="13.24">r</tspan><tspan class="cls-25" x="30.86" y="13.24">ent</tspan><tspan class="cls-16" x="45.87" y="13.24">l</tspan><tspan class="cls-22" x="48.34" y="13.24">y</tspan><tspan class="cls-25" x="53.52" y="13.24">, I on</tspan><tspan class="cls-16" x="76.62" y="13.24">l</tspan><tspan class="cls-25" x="79.09" y="13.24">y accept c</tspan><tspan class="cls-18" x="128.31" y="13.24">r</tspan><tspan class="cls-25" x="132.23" y="13.24">yp</tspan><tspan class="cls-19" x="143.98" y="13.24">t</tspan><tspan class="cls-25" x="147.15" y="13.24">ocu</tspan><tspan class="cls-18" x="164.77" y="13.24">r</tspan><tspan class="cls-20" x="168.69" y="13.24">r</tspan><tspan class="cls-25" x="172.29" y="13.24">en</tspan><tspan class="cls-21" x="184.03" y="13.24">c</tspan><tspan class="cls-25" x="189.55" y="13.24">y donations via Bi</tspan><tspan class="cls-19" x="272.75" y="13.24">t</tspan><tspan class="cls-25" x="275.92" y="13.24">coin, Li</tspan><tspan class="cls-19" x="309.73" y="13.24">t</tspan><tspan class="cls-25" x="312.9" y="13.24">ecoin, Ethe</tspan><tspan class="cls-20" x="365.49" y="13.24">r</tspan><tspan class="cls-25" x="369.09" y="13.24">eum and Mone</tspan><tspan class="cls-20" x="439.63" y="13.24">r</tspan><tspan class="cls-25" x="443.23" y="13.24">o.</tspan></tspan><tspan class="cls-8"><tspan class="cls-29" x="0" y="35">*</tspan><tspan x="9.01" y="35">コーヒーは飲めないのでココアです</tspan><tspan class="cls-38" x="201.01" y="35">。</tspan></tspan><tspan class="cls-4"><tspan class="cls-28" x="0" y="49" xml:space="preserve">   </tspan><tspan class="cls-25" x="10.12" y="48.24">I don&apos;t d</tspan><tspan class="cls-17" x="48.86" y="48.24">r</tspan><tspan class="cls-25" x="52.72" y="48.24">ink co</tspan><tspan class="cls-23" x="81.06" y="48.24">f</tspan><tspan class="cls-24" x="84.37" y="48.24">f</tspan><tspan class="cls-25" x="87.78" y="48.24">ee, so it&apos;s coc</tspan><tspan class="cls-17" x="153.42" y="48.24">o</tspan><tspan class="cls-25" x="159.51" y="48.24">a.</tspan></tspan><tspan class="cls-8"><tspan class="cls-29" x="0" y="70">*</tspan><tspan x="9.01" y="70">仮想通貨で寄付を募るというアイデア、そし</tspan><tspan class="cls-29" x="249.01" y="70">て</tspan><tspan x="264.01" y="70">Li</tspan><tspan class="cls-30" x="273.7" y="70">t</tspan><tspan x="277.51" y="70">ecoi</tspan><tspan class="cls-29" x="301.46" y="70">nと</tspan><tspan x="326.55" y="70">Mone</tspan><tspan class="cls-31" x="358.68" y="70">r</tspan><tspan class="cls-29" x="362.99" y="70">o</tspan><tspan x="373.19" y="70">の選択は soichi &lt;soichi1208@p</tspan><tspan class="cls-31" x="548.6" y="70">r</tspan><tspan x="552.91" y="70">o</tspan><tspan class="cls-30" x="560.11" y="70">t</tspan><tspan x="563.92" y="70">on.me&gt; さんを参考にしています</tspan><tspan class="cls-38" x="742.48" y="70">。</tspan></tspan><tspan class="cls-3"><tspan x="0" y="82.24" xml:space="preserve">   The id</tspan><tspan class="cls-26" x="37.99" y="82.24">e</tspan><tspan x="43.92" y="82.24">a of raising funds th</tspan><tspan class="cls-31" x="138.13" y="82.24">r</tspan><tspan x="141.73" y="82.24">ough c</tspan><tspan class="cls-27" x="174.21" y="82.24">r</tspan><tspan x="178.13" y="82.24">yp</tspan><tspan class="cls-30" x="189.88" y="82.24">t</tspan><tspan x="193.05" y="82.24">ocu</tspan><tspan class="cls-27" x="210.67" y="82.24">r</tspan><tspan class="cls-31" x="214.59" y="82.24">r</tspan><tspan x="218.19" y="82.24">en</tspan><tspan class="cls-32" x="229.93" y="82.24">c</tspan><tspan class="cls-33" x="235.45" y="82.24">y</tspan><tspan x="240.63" y="82.24">, as </tspan><tspan class="cls-41" x="260.03" y="82.24">w</tspan><tspan x="268.03" y="82.24">ell as the choice of Li</tspan><tspan class="cls-30" x="368.04" y="82.24">t</tspan><tspan x="371.21" y="82.24">ecoin and Mone</tspan><tspan class="cls-31" x="447.12" y="82.24">r</tspan><tspan x="450.72" y="82.24">o, was inspi</tspan><tspan class="cls-31" x="506.45" y="82.24">r</tspan><tspan x="510.05" y="82.24">ed </tspan><tspan class="cls-32" x="524.81" y="82.24">b</tspan><tspan x="530.74" y="82.24">y soichi &lt;soichi1208@p</tspan><tspan class="cls-31" x="642.53" y="82.24">r</tspan><tspan x="646.13" y="82.24">o</tspan><tspan class="cls-30" x="652.13" y="82.24">t</tspan><tspan x="655.3" y="82.24">on.me&gt;.</tspan></tspan></text>
